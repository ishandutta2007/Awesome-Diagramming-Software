<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cyan-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="cyan-violet" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="pink-orange" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f97316"/></linearGradient><linearGradient id="card-bg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1;filter:drop-shadow(0 0 12px #06b6d4)}}@keyframes float-card{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes float-card-reverse{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.animated-dash{stroke-dasharray:8 8;animation:dash-flow 2s linear infinite}.float-1{animation:float-card 6s ease-in-out infinite}.float-2{animation:float-card-reverse 5s ease-in-out infinite}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40"/></pattern><rect width="1200" height="400" fill="url(#grid)"/></g><g stroke-width="2" o