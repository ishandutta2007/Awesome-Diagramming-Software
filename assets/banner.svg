<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Flow Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="pink-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <!-- SVG Animations -->
    <style>
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #06b6d4); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes float-card {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float-card-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      .animated-dash {
        stroke-dasharray: 8 8;
        animation: dash-flow 2s linear infinite;
      }
      .node-pulse {
        transform-origin: center;
        animation: pulse-node 4s ease-in-out infinite;
      }
      .float-1 { animation: float-card 6s ease-in-out infinite; }
      .float-2 { animation: float-card-reverse 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Background Dynamic Diagram Flow Connections (Behind Text) -->
  <g stroke-width="2" opacity="0.35">
    <!-- Curved Connections -->
    <path d="M 100 100 Q 250 40 400 120 T 700 80" fill="none" stroke="#06b6d4" class="animated-dash"/>
    <path d="M 800 320 Q 950 360 1100 280" fill="none" stroke="#ec4899" class="animated-dash"/>
    <path d="M 150 320 Q 300 380 500 300" fill="none" stroke="#8b5cf6" class="animated-dash"/>
  </g>

  <!-- Floating Decorative Nodes (Subtle, Opacity Controlled) -->
  <g opacity="0.25" class="float-1">
    <rect x="80" y="60" width="120" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="140" y="90" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flowchart</text>
  </g>
  
  <g opacity="0.25" class="float-2">
    <rect x="1000" y="70" width="130" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="1065" y="100" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UML Diagram</text>
  </g>

  <g opacity="0.25" class="float-1">
    <rect x="980" y="280" width="140" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1050" y="310" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Whiteboard</text>
  </g>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="600" cy="180" r="180" fill="#06b6d4" opacity="0.12" filter="url(#cyan-glow)"/>
  <circle cx="200" cy="300" r="140" fill="#8b5cf6" opacity="0.10" filter="url(#cyan-glow)"/>
  <circle cx="1000" cy="120" r="130" fill="#ec4899" opacity="0.10" filter="url(#cyan-glow)"/>

  <!-- Foreground Main Content Container -->
  <!-- Dark Backdrop Card to Ensure Title & Subtitle Are Always Crystal Clear -->
  <rect x="180" y="70" width="840" height="260" rx="20" fill="url(#card-bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Top Badge Pills inside Header -->
  <g transform="translate(600, 115)">
    <!-- Pill 1 -->
    <rect x="-190" y="-16" width="120" height="28" rx="14" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1"/>
    <text x="-130" y="3" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 SaaS &amp; OS</text>

    <!-- Pill 2 -->
    <rect x="-55" y="-16" width="110" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="0" y="3" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Flowcharts</text>

    <!-- Pill 3 -->
    <rect x="70" y="-16" width="120" height="28" rx="14" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="1"/>
    <text x="130" y="3" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Architecture</text>
  </g>

  <!-- FOREGROUND TITLE (Crisp, High Contrast, Gradient & Glow) -->
  <text x="600" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-0.5">
    Awesome Diagramming Software
  </text>
  
  <!-- Gradient Line Accent -->
  <rect x="360" y="215" width="480" height="4" rx="2" fill="url(#cyan-violet)"/>

  <!-- FOREGROUND SUBTITLE -->
  <text x="600" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#cbd5e1">
    Curated List of Flowcharts, UML Models, Architecture Diagrams &amp; Visual Whiteboards
  </text>

  <!-- Bottom Metadata Badge -->
  <text x="600" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#94a3b8" letter-spacing="1">
    PROVEN COMMERCIAL SAAS &amp; HIGH-STAR OPEN-SOURCE PROJECTS
  </text>
</svg>
